[package]
name = "dot-cli"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A Ratatui workspace for chezmoi, Git, and machine configuration"
repository = "https://github.com/ujjwal6792/dot-cli"

[[bin]]
name = "dot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1.23", features = ["v4"] }
fs2 = "0.4"
walkdir = "2.5"
tempfile = "3.19"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
strip = true
