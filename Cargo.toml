[package]
name = "dotwarden"
version = "0.1.0"
edition = "2024"
description = "Dotfiles, secrets and variables in sync across machines (dotwarden / dw)"
license = "MIT"
default-run = "dotwarden"

[lib]
name = "dotwarden"
path = "src/lib.rs"

[[bin]]
name = "dotwarden"
path = "src/main.rs"

[[bin]]
name = "dw"
path = "src/bin/dw.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
crossterm = "0.29.0"
ignore = "0.4.33"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
