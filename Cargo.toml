[package]
name = "dot-cli"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "A Ratatui workspace for chezmoi, Git, and machine configuration"
repository = "https://github.com/ujjwal6792/dot-cli"

[[bin]]
name = "dot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
libc = "0.2"
clap = { version = "4.5", features = ["derive", "env"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
uuid = { version = "1.23", features = ["v4"] }
fs2 = "0.4"
walkdir = "2.5"
tempfile = "3.19"
chrono = { version = "0.4", features = ["serde"] }
trash = "5.2.9"
tree-sitter-highlight = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-lua = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-ini = "1.4"

[profile.release]
lto = "thin"
strip = true
