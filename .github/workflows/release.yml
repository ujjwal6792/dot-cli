name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      approved_version:
        description: Explicit owner-selected new version (v0.1.0-rc.N)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'ujjwal6792/dots-cli'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dot/browser/go.mod
          cache-dependency-path: tools/dot/browser/go.sum
      - name: Check dispatch, current main, and monotonic version
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        run: |
          git fetch --force origin main --tags
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          EXISTING_VERSIONS="$(git tag --list; gh api --paginate "repos/$GH_REPOSITORY/releases" --jq '.[].tag_name')"
          python3 scripts/release-gate.py \
            --repository "$GH_REPOSITORY" --event-name "$GH_EVENT_NAME" \
            --ref "$GH_REF" --sha "$GH_SHA" --current-main "$CURRENT_MAIN" \
            --version "$APPROVED_VERSION" --existing-tags "$EXISTING_VERSIONS"
      - name: Install isolated test tools
        run: brew install bats-core chezmoi gitleaks gum tmux zsh
      - name: Run public test suite
        run: ./scripts/run-tests.sh all
      - name: Scan complete public Git history
        run: gitleaks git --redact --log-opts='--all' .

  build:
    needs: verify
    if: github.repository == 'ujjwal6792/dots-cli'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dot/browser/go.mod
          cache-dependency-path: tools/dot/browser/go.sum
      - name: Recheck dispatch and current main before building
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        run: |
          git fetch --force origin main --tags
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          EXISTING_VERSIONS="$(git tag --list; gh api --paginate "repos/$GH_REPOSITORY/releases" --jq '.[].tag_name')"
          python3 scripts/release-gate.py \
            --repository "$GH_REPOSITORY" --event-name "$GH_EVENT_NAME" \
            --ref "$GH_REF" --sha "$GH_SHA" --current-main "$CURRENT_MAIN" \
            --version "$APPROVED_VERSION" --existing-tags "$EXISTING_VERSIONS"
      - name: Build all supported public packages from checked-out main
        env:
          APPROVED_VERSION: ${{ inputs.approved_version }}
        run: |
          VERSION="${APPROVED_VERSION#v}"
          python3 scripts/build-release.py --version "$VERSION" --output candidate
          python3 scripts/build-release.py --version "$VERSION" --output candidate-repeat
          python3 scripts/check-release.py candidate
          python3 scripts/check-release.py candidate-repeat
          for asset in candidate/*; do
            cmp "$asset" "candidate-repeat/${asset##*/}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: candidate/
          if-no-files-found: error
          retention-days: 1

  installed-smoke:
    needs: build
    if: github.repository == 'ujjwal6792/dots-cli'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dot/browser/go.mod
          cache-dependency-path: tools/dot/browser/go.sum
      - name: Recheck dispatch and current main before installed smoke
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
        run: |
          git fetch --force origin main --tags
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          EXISTING_VERSIONS="$(git tag --list; gh api --paginate "repos/$GH_REPOSITORY/releases" --jq '.[].tag_name')"
          python3 scripts/release-gate.py \
            --repository "$GH_REPOSITORY" --event-name "$GH_EVENT_NAME" \
            --ref "$GH_REF" --sha "$GH_SHA" --current-main "$CURRENT_MAIN" \
            --version "$APPROVED_VERSION" --existing-tags "$EXISTING_VERSIONS"
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: candidate
      - name: Restore browser executable modes after artifact download
        run: python3 scripts/restore-release-executables.py candidate
      - name: Install isolated smoke-test tools
        run: brew install bats-core chezmoi gum tmux zsh
      - name: Verify all archives and exercise the extracted macOS package
        env:
          APPROVED_VERSION: ${{ inputs.approved_version }}
        run: |
          python3 scripts/check-release.py candidate
          VERSION="${APPROVED_VERSION#v}"
          PACKAGE="candidate/dot-cli-${VERSION}-darwin-arm64.tar.gz"
          mkdir extracted
          tar -xzf "$PACKAGE" -C extracted
          mkdir -p "$RUNNER_TEMP/dot-cli-smoke"
          python3 scripts/accept-installed.py \
            --release extracted/dot-cli \
            --temporary-directory "$RUNNER_TEMP/dot-cli-smoke"

  publish:
    needs: [verify, build, installed-smoke]
    if: github.repository == 'ujjwal6792/dots-cli'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Final main/version gate and existing-release check
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          APPROVED_VERSION: ${{ inputs.approved_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin main --tags
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          EXISTING_VERSIONS="$(git tag --list; gh api --paginate "repos/$GH_REPOSITORY/releases" --jq '.[].tag_name')"
          python3 scripts/release-gate.py \
            --repository "$GH_REPOSITORY" --event-name "$GH_EVENT_NAME" \
            --ref "$GH_REF" --sha "$GH_SHA" --current-main "$CURRENT_MAIN" \
            --version "$APPROVED_VERSION" --existing-tags "$EXISTING_VERSIONS"
          if gh release view "$APPROVED_VERSION" >/dev/null 2>&1; then
            echo "release already exists: $APPROVED_VERSION" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: candidate
      - name: Stage verified assets as a draft, then publish atomically
        env:
          APPROVED_VERSION: ${{ inputs.approved_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-release.py candidate
          cat > release-notes.md <<'NOTES'
          ## Review and platform notes

          This prerelease was built by GitHub Actions from the exact public `main` commit shown for this release. The archives contain the public CLI only; no private manifest, inventory, credentials, backups, or private history are included.

          Supported packages: macOS Apple Silicon (darwin-arm64), Linux x86_64 (linux-amd64), and Linux ARM64 (linux-arm64). Native Linux installation and package-manager behavior are not provided or implied.

          No credentials or GitHub authentication are bundled. Access to a user's private configuration repository requires that user to authenticate separately with GitHub CLI and have repository access.

          `SHA256SUMS` and `BROWSER_SHA256SUMS` detect accidental corruption and bind the browser to each archive. Checksums are not a cryptographic attestation or independent proof of provenance. Review the workflow run and source commit before installation. The macOS GitHub-hosted installed-package smoke is not native Linux acceptance evidence.
          NOTES
          gh release create "$APPROVED_VERSION" \
            --target "$GITHUB_SHA" --title "$APPROVED_VERSION" \
            --notes-file release-notes.md --prerelease --draft
          gh release upload "$APPROVED_VERSION" candidate/*
          gh api "repos/$GH_REPOSITORY/releases/tags/$APPROVED_VERSION" \
            --jq '[.assets[] | {name, digest}]' > uploaded-assets.json
          python3 scripts/verify-release-assets.py candidate uploaded-assets.json
          RELEASE_ID="$(gh api "repos/$GH_REPOSITORY/releases/tags/$APPROVED_VERSION" --jq .id)"
          gh api --method PATCH "repos/$GH_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true
