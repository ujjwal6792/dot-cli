name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build release archives
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a version tag such as v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          mkdir -p dist
          for target in darwin-arm64 linux-amd64 linux-arm64; do
            stage="$RUNNER_TEMP/dot-release/$target"
            mkdir -p "$stage"
            GOOS="${target%-*}" GOARCH="${target#*-}" \
              go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG#v}" \
              -o "$stage/dot" ./cmd/dot
            tar -czf "dist/dot-${RELEASE_TAG#v}-$target.tar.gz" -C "$stage" dot
          done
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
