name: Diagnose rc2 update test

on:
  push:
    branches: [fix/release-rc2-tests]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/dot/browser/go.mod
          cache-dependency-path: tools/dot/browser/go.sum
      - name: Install release-test tools
        run: brew install bats-core chezmoi gitleaks gum tmux zsh
      - name: Repeat the exact failing test
        shell: bash
        run: |
          set +e
          failures=0
          for attempt in 1 2 3 4 5; do
            echo "[rc2-diagnostic] attempt=$attempt"
            bats --filter 'v3 pull detects target bytes modes or approval changing during review before source mutation' tests/independent-updates.bats
            result=$?
            echo "[rc2-diagnostic] attempt=$attempt bats_rc=$result"
            if [ "$result" -ne 0 ]; then failures=$((failures + 1)); fi
          done
          echo "[rc2-diagnostic] failures=$failures/5"
          [ "$failures" -eq 0 ]
